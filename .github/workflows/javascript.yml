name: JavaScript and Vue example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: npm ci
      - run: npm test
      - run: composer install --working-dir=examples/laravel --no-interaction --prefer-dist
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results/playwright
